<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Schema 提取工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .instruction {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #1976d2;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            max-height: 600px;
            overflow-y: auto;
            display: none;
        }
        #result.show {
            display: block;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.loading {
            background: #fff3cd;
            border: 1px solid #ffc107;
        }
        .status.success {
            background: #d4edda;
            border: 1px solid #28a745;
        }
        .status.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Notion Database Schema 提取工具</h1>
        
        <div class="instruction">
            <strong>使用說明：</strong>
            <ol>
                <li>確認 <code>config.json</code> 中已設定 Notion Token 和 Database ID</li>
                <li>點擊下方按鈕提取 Schema</li>
                <li>查看所有欄位的下拉選單選項</li>
                <li>可以直接複製結果中的 JavaScript 物件使用</li>
            </ol>
        </div>

        <button id="extractBtn" onclick="runExtraction()">
            📊 提取 Notion Schema
        </button>

        <div id="status" class="status"></div>
        <div id="result"></div>
    </div>

    <!-- 載入依賴 -->
    <script src="config-manager.js"></script>
    <script src="notion-schema-extractor.js"></script>

    <script>
        async function runExtraction() {
            const btn = document.getElementById('extractBtn');
            const status = document.getElementById('status');
            const result = document.getElementById('result');

            // 重置
            btn.disabled = true;
            status.className = 'status show loading';
            status.textContent = '⏳ 正在提取 Schema...';
            result.className = 'result';
            result.textContent = '';

            try {
                // 捕獲 console.log 輸出
                const logs = [];
                const originalLog = console.log;
                console.log = function(...args) {
                    logs.push(args.map(arg => 
                        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                    ).join(' '));
                    originalLog.apply(console, args);
                };

                // 執行提取
                await window.extractNotionSchema();

                // 恢復 console.log
                console.log = originalLog;

                // 顯示結果
                result.textContent = logs.join('\n');
                result.className = 'result show';
                
                status.className = 'status show success';
                status.textContent = '✅ Schema 提取成功！請查看下方結果';

            } catch (error) {
                console.error('提取失敗:', error);
                
                status.className = 'status show error';
                status.textContent = `❌ 提取失敗: ${error.message}`;
                
                result.textContent = `錯誤詳情:\n${error.stack}`;
                result.className = 'result show';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
